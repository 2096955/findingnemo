steps:
  # Copy pre-built frontend static/ to Docker build context
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - "cp -r client/webui/frontend/static frontend-static"

  # Docker build
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/whale-agent:${_TAG}"
      - "-t"
      - "gcr.io/$PROJECT_ID/whale-agent:latest"
      - "-f"
      - "infra/Dockerfile"
      - "."

  # Push
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/whale-agent:${_TAG}"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/whale-agent:latest"]

images:
  - "gcr.io/$PROJECT_ID/whale-agent:${_TAG}"
  - "gcr.io/$PROJECT_ID/whale-agent:latest"

substitutions:
  _TAG: "v1"

timeout: "600s"

options:
  machineType: "E2_HIGHCPU_8"
