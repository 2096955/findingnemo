# Self-hosted SearXNG for private web search (no Brave/Tavily API keys).
#
# Usage:
#   docker compose -f docker-compose.searxng.yml up -d
#   export SEARXNG_URL=http://localhost:8080
#
# The Whale Agent MCP server on port 9007 and web_intelligence tools read
# SEARXNG_URL automatically when set.

services:
  searxng:
    image: searxng/searxng:latest
    container_name: findingnemo-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
