# Minimal SearXNG settings for local development.
# JSON format must be enabled for the Whale Agent SearXNG integration.

use_default_settings: true

server:
  secret_key: "change-me-in-production"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: "google"
  formats:
    - html
    - json
