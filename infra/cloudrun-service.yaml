apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: whale-agent
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/startup-cpu-boost: "true"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 600
      serviceAccountName: healthcare-poc-vertexai@gbg-neuro.iam.gserviceaccount.com
      containers:
        - image: gcr.io/gbg-neuro/whale-agent:v9
          name: whale-agent-1
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
          env:
            - name: LLM_PROVIDER
              value: gemini
            - name: GEMINI_MODEL
              value: gemini-2.0-flash
            - name: GEMINI_API_KEY
              value: AIzaSyBOrXdwsFvLKSKRe8KUFJwnCslpkgvq6Vo
            - name: NAMESPACE
              value: whale-agent
            - name: SOLACE_DEV_MODE
              value: "true"
            - name: SESSION_SECRET_KEY
              value: whale-agent-session-key-2026-prod
            - name: FIRECRAWL_API_KEY
              value: "fc-2146c607264b4ea899e16c2a7bc951ec"
            - name: BRAVE_SEARCH_API_KEY
              value: "BSAywatPDpXvmOj72JwHZnVelu0jPHx"
            - name: GOOGLE_MAPS_API_KEY
              value: "AIzaSyBOrXdwsFvLKSKRe8KUFJwnCslpkgvq6Vo"
          startupProbe:
            failureThreshold: 3
            periodSeconds: 120
            tcpSocket:
              port: 8080
            timeoutSeconds: 120
  traffic:
    - percent: 100
      latestRevision: true
