apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: whale-route-monitor
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/startup-cpu-boost: "true"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: healthcare-poc-vertexai@gbg-neuro.iam.gserviceaccount.com
      containers:
        - image: gcr.io/gbg-neuro/whale-route-monitor:v1
          name: whale-route-monitor
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
          env:
            - name: PORT
              value: "8080"
            - name: LLM_PROVIDER
              value: gemini
            - name: LLM_API_KEY
              value: AIzaSyBOrXdwsFvLKSKRe8KUFJwnCslpkgvq6Vo
            - name: LLM_MODEL
              value: gemini-2.0-flash
            - name: FIRECRAWL_API_KEY
              value: "fc-2146c607264b4ea899e16c2a7bc951ec"
            - name: REFRESH_INTERVAL_MINUTES
              value: "15"
          startupProbe:
            failureThreshold: 3
            periodSeconds: 60
            httpGet:
              path: /api/health
              port: 8080
            timeoutSeconds: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 120
            timeoutSeconds: 10
  traffic:
    - percent: 100
      latestRevision: true
