[project]
name = "whale-agent"
version = "0.1.0"
description = "Whale-vessel collision avoidance agent built on Solace Agent Mesh"
requires-python = ">=3.10"
dependencies = [
    "solace-agent-mesh>=1.16,<2.0",
    "fastmcp>=2.11,<3.0",
    "httpx>=0.27,<1.0",
    "redis[hiredis]>=5.0,<6.0",
    "langfuse>=2.0,<3.0",
    "litellm>=1.0",
    "firecrawl-py>=1.5,<2.0",
    "duckduckgo-search>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock",
    "respx>=0.21",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]
