# Whale Agent - Web UI Gateway Configuration

log:
  stdout_log_level: INFO
  log_file_level: INFO
  log_file: webui.log

!include ../shared_config.yaml

apps:
  - name: whale_agent_webui_app
    app_base_path: .
    app_module: solace_agent_mesh.gateway.http_sse.app
    broker:
      <<: *broker_connection

    app_config:
      namespace: ${NAMESPACE}
      session_secret_key: "${SESSION_SECRET_KEY}"

      artifact_service: *default_artifact_service
      session_service:
        type: "sql"
        database_url: "sqlite:///whale_agent_webui.db"
        default_behavior: "PERSISTENT"

      model: *general_model
      fastapi_host: 0.0.0.0
      fastapi_port: 8080
      cors_allowed_origins:
        - "http://localhost:3000"
        - "http://127.0.0.1:3000"
      cors_allow_credentials: true
      enable_embed_resolution: true
      sse_max_queue_size: 200

      system_purpose: >
        Whale Agent is an AI-powered maritime safety system that helps reduce
        whale-vessel collisions. It provides risk-assessed shipping routes,
        real-time whale sighting data, and dynamic risk maps.

      response_format: >
        Responses should be formatted in Markdown. Include risk scores,
        distance estimates, and species data when available.

      frontend_welcome_message: "Welcome to Whale Agent! Ask me to plan a safe shipping route, check whale activity, or assess collision risk."
      frontend_bot_name: "Whale Agent"
      frontend_collect_feedback: true
      frontend_use_authorization: false

      background_tasks:
        default_timeout_ms: 3600000
