# Whale Agent - Whale Migration Tracker Specialist
# Tracks seasonal migration patterns using GBIF occurrence data

log:
  stdout_log_level: INFO
  log_file_level: INFO
  log_file: whale_migration_tracker.log

!include ../shared_config.yaml

apps:
  - name: whale_migration_tracker_app
    app_base_path: .
    app_module: solace_agent_mesh.agent.sac.app
    broker:
      <<: *broker_connection

    app_config:
      namespace: ${NAMESPACE}
      supports_streaming: true
      agent_name: "WhaleMigrationTracker"
      display_name: "Whale Migration Tracker"
      model: *specialist_model

      instruction: |
        You are the Whale Migration Tracker for Whale Agent, an expert in
        cetacean seasonal migration patterns and movement corridors.

        **PRIMARY ROLE:**
        Track and predict seasonal whale migration patterns using occurrence
        data, historical sighting records, and migration models. Identify
        active migration corridors that intersect with shipping lanes.

        **WORKFLOW:**
        1. Receive species/region/season query from the Orchestrator
        2. Use migration_model to predict current migration status and corridors
        3. Use GBIF MCP tools for recent occurrence records in the area
        4. Cross-reference migration timing with vessel route timing
        5. Store migration data in memory_plane (namespace: evidence)
        6. Return structured migration assessment

        **KEY SPECIES MIGRATIONS (Pacific):**
        - Gray whale (E. robustus): Nov-Feb southbound, Mar-Jun northbound, CA coast
        - Humpback (M. novaeangliae): Dec-Apr breeding HI, Apr-Nov feeding AK/CA
        - Blue whale (B. musculus): Jun-Oct CA/OR feeding, Nov-May Central America
        - North Pacific right whale (E. japonica): rare, critical, Bering Sea summer

        **RESPONSE FORMAT:**
        Return ONLY a raw JSON object — no markdown fences, no prose outside the JSON.
        {"findings": [
           "Humpback northbound migration active through Santa Barbara Channel...",
           "GBIF records show 127 humpback sightings in AOI last 30 days..."
         ],
         "migration_data": {
           "species": "Megaptera novaeangliae",
           "migration_phase": "northbound_feeding",
           "corridor_active": true,
           "peak_months": ["Mar", "Apr", "May"],
           "density_estimate": "HIGH",
           "corridor_geometry": {"type": "LineString", "coordinates": [...]}
         },
         "sources": [{"title": "...", "source_type": "gbif",
           "snippet": "..."}],
         "confidence": 0.78,
         "gaps": ["Limited satellite tag data for current season"],
         "execution_status": "success",
         "mcp_failures": []}

      tools:
        - tool_type: python
          component_module: whale_tools.migration_model
          component_base_path: src

        - tool_type: python
          component_module: whale_tools.memory_plane
          component_base_path: src
          tool_config:
            redis_url: ${REDIS_URL, redis://localhost:6379/0}
            cold_db_path: data/whale_cold.db

        - tool_type: mcp
          name: whale_alert_tools
          connection_params:
            type: sse
            url: "http://localhost:9002/sse"
            timeout: 30

        - tool_type: mcp
          name: gbif_tools
          connection_params:
            type: sse
            url: "http://localhost:9005/sse"
            timeout: 30

      session_service: *default_session_service
      artifact_service: *default_artifact_service
      max_llm_calls_per_task: 15

      agent_card:
        description: "Whale migration specialist. Tracks seasonal cetacean migrations, predicts corridor activity, and identifies shipping lane intersections."
        defaultInputModes: ["text"]
        defaultOutputModes: ["text"]
        skills:
          - id: migration_tracking
            name: Migration Pattern Tracking
            description: Tracks and predicts seasonal whale migration corridors.
          - id: occurrence_analysis
            name: Occurrence Data Analysis
            description: Analyzes GBIF whale occurrence records for density estimation.

      agent_card_publishing: { interval_seconds: 10 }
      agent_discovery: { enabled: true }
      inter_agent_communication:
        allow_list: []
        deny_list: ["WhaleMigrationTracker"]
        request_timeout_seconds: 600
