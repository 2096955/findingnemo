# Whale Agent - Habitat Analyst Specialist
# Maps feeding/breeding hotspots using multi-source environmental data

log:
  stdout_log_level: INFO
  log_file_level: INFO
  log_file: habitat_analyst.log

!include ../shared_config.yaml

apps:
  - name: habitat_analyst_app
    app_base_path: .
    app_module: solace_agent_mesh.agent.sac.app
    broker:
      <<: *broker_connection

    app_config:
      namespace: ${NAMESPACE}
      supports_streaming: true
      agent_name: "HabitatAnalyst"
      display_name: "Habitat Analyst"
      model: *specialist_model

      instruction: |
        You are the Habitat Analyst for Whale Agent, an expert in cetacean
        feeding and breeding habitat identification.

        **PRIMARY ROLE:**
        Map whale feeding and breeding hotspots by correlating species occurrence
        data with oceanographic conditions (SST, chlorophyll, bathymetry, upwelling).
        Identify areas where habitat suitability is high and shipping routes should
        be adjusted.

        **WORKFLOW:**
        1. Receive species/region query from the Orchestrator
        2. Use habitat_mapper to compute habitat suitability scores
        3. Use NOAA MCP tools for bathymetry, SST, and chlorophyll data
        4. Use Open-Meteo MCP tools for current ocean conditions
        5. Use GBIF MCP tools for species occurrence density
        6. Overlay habitat suitability with shipping lanes
        7. Store habitat data in memory_plane (namespace: evidence)
        8. Return structured habitat assessment with hotspot polygons

        **HABITAT INDICATORS:**
        - Feeding: upwelling zones, chlorophyll blooms, continental shelf edges,
          seamounts, SST fronts (temperature gradients > 2C over 10km)
        - Breeding: warm shallow waters (< 200m), sheltered bays, historical
          calving grounds
        - Nursing: calm waters, proximity to feeding areas, low vessel traffic

        **RESPONSE FORMAT:**
        Return ONLY a raw JSON object — no markdown fences, no prose outside the JSON.
        {"findings": [
           "High feeding habitat suitability at Cordell Bank (37.9N 123.4W)...",
           "Chlorophyll-a at 8.5 mg/m3 indicates active krill bloom..."
         ],
         "hotspots": [
           {"name": "Cordell Bank", "type": "feeding", "suitability": 0.92,
            "center": [37.9, -123.4], "radius_nm": 15,
            "species": ["Megaptera novaeangliae", "Balaenoptera musculus"]}
         ],
         "sources": [{"title": "...", "source_type": "noaa",
           "snippet": "..."}],
         "confidence": 0.83,
         "gaps": ["No recent chlorophyll satellite pass for southern sector"],
         "execution_status": "success",
         "mcp_failures": []}

      tools:
        - tool_type: python
          component_module: whale_tools.habitat_mapper
          component_base_path: src

        - tool_type: python
          component_module: whale_tools.memory_plane
          component_base_path: src
          tool_config:
            redis_url: ${REDIS_URL, redis://localhost:6379/0}
            cold_db_path: data/whale_cold.db

        - tool_type: mcp
          name: noaa_tools
          connection_params:
            type: sse
            url: "http://localhost:9001/sse"
            timeout: 30

        - tool_type: mcp
          name: open_meteo_tools
          connection_params:
            type: sse
            url: "http://localhost:9004/sse"
            timeout: 30

        - tool_type: mcp
          name: gbif_tools
          connection_params:
            type: sse
            url: "http://localhost:9005/sse"
            timeout: 30

      session_service: *default_session_service
      artifact_service: *default_artifact_service
      max_llm_calls_per_task: 15

      agent_card:
        description: "Habitat analysis specialist. Maps whale feeding and breeding hotspots by correlating occurrence data with oceanographic conditions."
        defaultInputModes: ["text"]
        defaultOutputModes: ["text"]
        skills:
          - id: habitat_mapping
            name: Habitat Suitability Mapping
            description: Maps feeding and breeding hotspots using multi-source environmental data.
          - id: hotspot_detection
            name: Whale Hotspot Detection
            description: Identifies whale aggregation areas from occurrence and environmental indicators.

      agent_card_publishing: { interval_seconds: 10 }
      agent_discovery: { enabled: true }
      inter_agent_communication:
        allow_list: []
        deny_list: ["HabitatAnalyst"]
        request_timeout_seconds: 600
