# Whale Agent - Incident Analyst Specialist
# Analyzes historical whale strike data and incident patterns

log:
  stdout_log_level: INFO
  log_file_level: INFO
  log_file: incident_analyst.log

!include ../shared_config.yaml

apps:
  - name: incident_analyst_app
    app_base_path: .
    app_module: solace_agent_mesh.agent.sac.app
    broker:
      <<: *broker_connection

    app_config:
      namespace: ${NAMESPACE}
      supports_streaming: true
      agent_name: "IncidentAnalyst"
      display_name: "Incident Analyst"
      model: *specialist_model

      instruction: |
        You are the Incident Analyst for Whale Agent, an expert in historical
        whale-vessel strike data and incident pattern analysis.

        **PRIMARY ROLE:**
        Analyze historical whale strike records to identify patterns, hotspots,
        and contributing factors. Provide evidence-based risk context for
        route planning decisions.

        **WORKFLOW:**
        1. Receive region/species/route query from the Orchestrator
        2. Use incident_analyzer to query the strike database and compute
           incident statistics
        3. Identify temporal patterns (seasonal peaks, time of day)
        4. Identify spatial patterns (clustering near ports, TSS lanes)
        5. Store incident data in memory_plane (namespace: evidence)
        6. Return structured incident assessment

        **KEY DATABASES:**
        - NOAA Ship Strike Database (US waters)
        - IWC Ship Strike Database (global)
        - Local port authority incident reports
        - Whale Alert app sighting/strike reports

        **ANALYSIS DIMENSIONS:**
        - Spatial: strike hotspots, proximity to shipping lanes
        - Temporal: seasonal peaks, multi-year trends
        - Species: which species most affected in the area
        - Vessel: vessel type, speed at impact, outcome severity
        - Outcome: lethal vs. non-lethal, calf vs. adult

        **RESPONSE FORMAT:**
        Return ONLY a raw JSON object — no markdown fences, no prose outside the JSON.
        {"findings": [
           "23 documented strikes in Santa Barbara Channel 2015-2024...",
           "78% of lethal strikes occurred at vessel speeds >10kt..."
         ],
         "incident_stats": {
           "total_strikes": 23,
           "lethal_strikes": 8,
           "species_breakdown": {"humpback": 12, "blue": 6, "fin": 5},
           "peak_months": ["Jul", "Aug", "Sep"],
           "avg_vessel_speed_kt": 14.2,
           "speed_threshold_lethal_kt": 10
         },
         "sources": [{"title": "...", "source_type": "strike_database",
           "snippet": "..."}],
         "confidence": 0.90,
         "gaps": ["2024 data incomplete — reporting lag"],
         "execution_status": "success",
         "mcp_failures": []}

      tools:
        - tool_type: python
          component_module: whale_tools.incident_analyzer
          component_base_path: src

        - tool_type: python
          component_module: whale_tools.memory_plane
          component_base_path: src
          tool_config:
            redis_url: ${REDIS_URL, redis://localhost:6379/0}
            cold_db_path: data/whale_cold.db

      session_service: *default_session_service
      artifact_service: *default_artifact_service
      max_llm_calls_per_task: 15

      agent_card:
        description: "Incident analysis specialist. Analyzes historical whale-vessel strike data to identify patterns, hotspots, and contributing factors."
        defaultInputModes: ["text"]
        defaultOutputModes: ["text"]
        skills:
          - id: strike_analysis
            name: Strike Incident Analysis
            description: Analyzes historical whale-vessel strike records and patterns.
          - id: hotspot_identification
            name: Strike Hotspot Identification
            description: Identifies geographic clustering of whale strike incidents.

      agent_card_publishing: { interval_seconds: 10 }
      agent_discovery: { enabled: true }
      inter_agent_communication:
        allow_list: []
        deny_list: ["IncidentAnalyst"]
        request_timeout_seconds: 600
