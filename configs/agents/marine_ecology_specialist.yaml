# Whale Agent - Marine Ecology Specialist
# Merged from: habitat_analyst + whale_migration_tracker
# Handles habitat mapping, migration tracking, and species occurrence analysis

log:
  stdout_log_level: INFO
  log_file_level: INFO
  log_file: marine_ecology_specialist.log

!include ../shared_config.yaml

apps:
  - name: marine_ecology_specialist_app
    app_base_path: .
    app_module: solace_agent_mesh.agent.sac.app
    broker:
      <<: *broker_connection

    app_config:
      namespace: ${NAMESPACE}
      supports_streaming: true
      agent_name: "MarineEcologySpecialist"
      display_name: "Marine Ecology Specialist"
      model: *specialist_model

      instruction: |
        You are the Marine Ecology Specialist for Whale Agent, combining
        habitat analysis and migration tracking expertise.

        **PRIMARY ROLE:**
        1. Map whale feeding/breeding hotspots using environmental data
        2. Track seasonal migration patterns and active corridors
        3. Identify where habitats and migration routes intersect shipping lanes

        **HABITAT ANALYSIS WORKFLOW:**
        - Use habitat_mapper for habitat suitability scores
        - Use NOAA MCP for bathymetry, SST, chlorophyll data
        - Use Open-Meteo MCP for current ocean conditions
        - Use GBIF MCP for species occurrence density

        **HABITAT INDICATORS:**
        - Feeding: upwelling zones, chlorophyll blooms, shelf edges, seamounts
        - Breeding: warm shallow waters (< 200m), sheltered bays, calving grounds
        - Nursing: calm waters, proximity to feeding areas, low vessel traffic

        **MIGRATION TRACKING WORKFLOW:**
        - Use migration_model to predict current corridors
        - Use GBIF MCP + Whale Alert MCP for recent sightings
        - Cross-reference migration timing with vessel route timing

        **KEY SPECIES MIGRATIONS (Pacific):**
        - Gray whale: Nov-Feb southbound, Mar-Jun northbound, CA coast
        - Humpback: Dec-Apr breeding HI, Apr-Nov feeding AK/CA
        - Blue whale: Jun-Oct CA/OR feeding, Nov-May Central America
        - North Pacific right whale: rare, critical, Bering Sea summer

        **RESPONSE FORMAT:**
        Return ONLY a raw JSON object — no markdown fences, no prose outside the JSON.
        {"findings": [...],
         "hotspots": [{"name": "...", "type": "feeding|breeding", "suitability": 0.92,
           "center": [lat, lng], "radius_nm": 15, "species": [...]}],
         "migration_data": {"species": "...", "migration_phase": "...",
           "corridor_active": true, "peak_months": [...], "density_estimate": "HIGH"},
         "sources": [...], "confidence": 0.85, "gaps": [...],
         "execution_status": "success", "mcp_failures": []}

      tools:
        - tool_type: python
          component_module: whale_tools.habitat_mapper
          component_base_path: src

        - tool_type: python
          component_module: whale_tools.migration_model
          component_base_path: src

        - tool_type: python
          component_module: whale_tools.memory_plane
          component_base_path: src
          tool_config:
            redis_url: ${REDIS_URL, redis://localhost:6379/0}
            cold_db_path: data/whale_cold.db

        - tool_type: mcp
          name: noaa_tools
          connection_params:
            type: sse
            url: "http://localhost:9001/sse"
            timeout: 30

        - tool_type: mcp
          name: whale_alert_tools
          connection_params:
            type: sse
            url: "http://localhost:9002/sse"
            timeout: 30

        - tool_type: mcp
          name: open_meteo_tools
          connection_params:
            type: sse
            url: "http://localhost:9004/sse"
            timeout: 30

        - tool_type: mcp
          name: gbif_tools
          connection_params:
            type: sse
            url: "http://localhost:9005/sse"
            timeout: 30

      session_service: *default_session_service
      artifact_service: *default_artifact_service
      max_llm_calls_per_task: 20

      agent_card:
        description: "Marine ecology specialist. Maps whale habitats, tracks seasonal migrations, and identifies shipping lane intersections with whale corridors."
        defaultInputModes: ["text"]
        defaultOutputModes: ["text"]
        skills:
          - id: habitat_mapping
            name: Habitat Suitability Mapping
            description: Maps feeding and breeding hotspots using environmental data.
          - id: migration_tracking
            name: Migration Pattern Tracking
            description: Tracks seasonal whale migration corridors.
          - id: occurrence_analysis
            name: Occurrence Data Analysis
            description: Analyzes whale occurrence records for density estimation.

      agent_card_publishing: { interval_seconds: 10 }
      agent_discovery: { enabled: true }
      inter_agent_communication:
        allow_list: []
        deny_list: ["MarineEcologySpecialist"]
        request_timeout_seconds: 600
